<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task Manager</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="wrap"><div class="hero"><div><h1>Task Manager</h1><p>Track work, progress and priorities</p></div><div class="pill">● LIVE SYSTEM</div></div><div class="cards"><div class="card"><div class="label">Total Tasks</div><div class="value" id="s0">-</div></div><div class="card"><div class="label">Completed</div><div class="value" id="s1">-</div></div><div class="card"><div class="label">In Progress</div><div class="value" id="s2">-</div></div><div class="card"><div class="label">Pending</div><div class="value" id="s3">-</div></div></div><div class="panel"><div class="heading"><h2>Live Data</h2><p>Information loaded from the Spring Boot REST API.</p></div><table><thead><tr><th>Task</th><th>Owner</th><th>Status</th><th>Priority</th></tr></thead><tbody id="body"><tr><td colspan="4">Loading...</td></tr></tbody></table></div><footer>Spring Boot + Maven • Java 17 • Port 8080</footer></div><script src="/js/app.js"></script></body></html>
